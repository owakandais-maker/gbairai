<meta name="application-name" content="GBAIRAI ZONE">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">
<meta property="og:site_name" content="GBAIRAI ZONE">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="./assets/css/base.css">
<link rel="stylesheet" href="./assets/css/views.css">

<script>
  /* Thème, langue et accessibilité appliqués avant le premier rendu : aucun flash. */
  (function () {
    var r = document.documentElement;
    function get(k, d) { try { var v = localStorage.getItem('gbzn.v1.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    try {
      var s = get('settings', {}) || {};
      var pref = s.theme || 'dark';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      r.dataset.theme = dark ? 'dark' : 'light';
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', dark ? '#06080f' : '#f4f6fb');
      var lang = s.locale || 'fr';
      r.lang = lang;
      r.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      if (s.accent) r.style.setProperty('--accent', s.accent);
      if (s.fontScale) r.style.setProperty('--font-scale', String(s.fontScale));
      if (s.contrast) r.dataset.contrast = 'high';
      if (s.reduceMotion) r.dataset.motion = 'reduced';
      if (s.density) r.dataset.density = s.density;
    } catch (e) { /* stockage indisponible : les valeurs par défaut s'appliquent */ }
  })();
</script>
</head>

<body>
  <a class="skip-link" href="#view">Aller au contenu</a>

  <!-- Toute l'interface est construite par assets/js/app.js -->
  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <aside id="sidebar" class="sidebar" hidden></aside>
    <main id="main" class="main">
      <div id="view" class="view" tabindex="-1">
        <div class="boot">
          <div class="boot-logo" aria-hidden="true"></div>
          <p class="boot-t">GBAIRAI ZONE</p>
          <div class="boot-bar"><span></span></div>
        </div>
      </div>
      <aside id="rail" class="rail" hidden></aside>
    </main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <div id="modal-root" class="modal-root"></div>
  <div id="sheet-root" class="sheet-root"></div>
  <div id="agent-root" class="agent-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <div style="max-width:620px;margin:120px auto;padding:28px;text-align:center;color:#e7ebf5">
      <h1 style="font-size:1.4rem;margin-bottom:12px">JavaScript requis</h1>
      <p>GBAIRAI ZONE est une application interactive : active JavaScript pour accéder au fil,
         aux shorts, au studio live et à l'agent OWAK.</p>
    </div>
  </noscript>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
